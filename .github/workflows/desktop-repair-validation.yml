name: Desktop Repair Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-http-retry:
    # Produce a source-identified local ACP repair candidate without publishing.
    if: github.repository == 'shanemhamilton/buzz' && (github.head_ref == 'fix/agent-http-rate-limit' || github.head_ref == 'fix/acp-thread-summary-admission')
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Validate ACP formatting and runtime regressions
        run: |
          cargo fmt --all -- --check
          cargo test -p buzz-acp rest_ -- --test-threads=1
          cargo test -p buzz-acp thread_summary -- --test-threads=1
          cargo test -p buzz-acp normal_listener_ephemeral_events_are_excluded_before_replay_state -- --test-threads=1
          cargo test -p buzz-acp verified_channel_event_is_recorded_and_forwarded -- --test-threads=1
          cargo clippy -p buzz-acp --all-targets -- -D warnings
      - name: Build the ACP repair candidate
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp
          git rev-parse HEAD > target/source-commit.txt
          shasum -a 256 "target/$TARGET/release/buzz-acp" > target/buzz-acp.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-acp-runtime-repair-${{ github.event.pull_request.head.sha }}
          path: |
            target/aarch64-apple-darwin/release/buzz-acp
            target/source-commit.txt
            target/buzz-acp.sha256
          if-no-files-found: error
          retention-days: 7

  observer-boundary-tests:
    # Read-only hosted validation for the observer encryption boundary repair.
    if: github.repository == 'shanemhamilton/buzz' && github.head_ref == 'fix/observer-encryption-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Observer encryption and fitting regressions
        run: |
          set -euo pipefail
          cargo test -p buzz-core observer::tests
          cargo test -p buzz-acp observer_ -- --test-threads=1

  validate-and-build:
    # This fork testing lane neither signs nor publishes a release.
    if: github.repository == 'shanemhamilton/buzz' && (github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/desktop-agent-workflow-repairs' || github.head_ref == 'upgrade/desktop-0.5.27-fork' || github.head_ref == 'upgrade/desktop-0.5.27-reviewed')
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      TARGET: aarch64-apple-darwin
      UPGRADE_CANDIDATE: ${{ github.head_ref == 'upgrade/desktop-0.5.27-fork' || github.ref_name == 'upgrade/desktop-0.5.27-fork' || github.head_ref == 'upgrade/desktop-0.5.27-reviewed' || github.ref_name == 'upgrade/desktop-0.5.27-reviewed' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          workspaces: |
            .
            desktop/src-tauri
      - name: Install desktop dependencies
        run: just desktop-install-ci
      - name: Frontend checks and regression tests
        run: |
          set -euo pipefail
          pnpm --dir desktop typecheck
          cd desktop
          node --import ./test-loader.mjs --experimental-strip-types --test \
            src/features/agents/lib/managedAgentDeletionAvailability.test.mjs \
            src/features/agents/lib/friendlyAgentLastError.test.mjs \
            src/features/agents/ui/PersonaDeleteDialog.test.mjs \
            src/features/workflows/ui/useWorkflowListAuthorPresentations.test.mjs \
            src/features/workflows/ui/useWorkflowListMessagePresentations.test.mjs
          node --import ./test-loader.mjs --experimental-strip-types --test \
            src/features/channels/observedUnreadNative.test.mjs \
            src/features/workflows/ui/workflowSchedule.test.mjs \
            src/features/workflows/ui/workflowFormTypes.test.mjs \
            src/features/workflows/ui/workflowDefinition.test.mjs
          node --import ./test-jsdom-setup.mjs --import ./test-loader.mjs \
            --experimental-strip-types --test-force-exit --test \
            src/features/agents/ui/PersonaDeleteDialog.jsdom-test.mjs
      - name: Runtime and CLI regression tests
        run: |
          set -euo pipefail
          env -u BUZZ_ACP_ALLOWED_RESPOND_TO -u BUZZ_ACP_LAZY_POOL -u BUZZ_ACP_IDLE_POOL_SLEEP cargo test -p buzz-acp error_outcome_emission_tests -- --test-threads=1
          cargo test -p buzz-acp pending_nonretryable_notice_skips_removed_channel
          cargo test -p buzz-cli workflows::tests
          cargo test -p buzz-workflow
          cargo test -p buzz-relay --lib nip11::tests
          cargo test -p buzz-agent --test fake_llm steer_rejected_on_empty_prompt
          cargo test -p buzz-acp session_resource
          cargo test -p buzz-acp cancelled_
          cargo test -p buzz-acp queue::tests
          cargo test -p buzz-acp recovery_wake::tests
          cargo test -p buzz-acp rest_ -- --test-threads=1
          cargo test -p buzz-acp thread_summary -- --test-threads=1
          cargo test -p buzz-acp normal_listener_ephemeral_events_are_excluded_before_replay_state -- --test-threads=1
          cargo test -p buzz-acp verified_channel_event_is_recorded_and_forwarded -- --test-threads=1
          cargo test -p buzz-core observer::tests
          cargo test -p buzz-acp observer_ -- --test-threads=1
          cargo fmt --all -- --check
          cargo clippy -p buzz-acp --all-targets -- -D warnings
      - name: Native regression tests
        run: |
          set -euo pipefail
          for name in buzz-acp buzz-agent buzz-backend-kubernetes buzz-dev-mcp git-credential-nostr buzz; do
            mkdir -p desktop/src-tauri/binaries
            touch "desktop/src-tauri/binaries/$name-$TARGET"
          done
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib commands::workflows::tests
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib commands::personas::delete_cascade_tests
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib agent_tombstone_retry_preserves_archive_persona_id_after_head_purge
      - name: Version the local repair candidate
        run: |
          set -euo pipefail
          VERSION=$(node -p "const base=require('./desktop/package.json').version.split('-')[0]; if (process.env.UPGRADE_CANDIDATE === 'true') { base+'-fork.'+process.env.GITHUB_RUN_NUMBER } else { const v=base.split('.'); v[2]=Number(v[2])+1; v.join('.')+'-repair.'+process.env.GITHUB_RUN_NUMBER }")
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri
          cargo update --workspace
      - name: Build actual sidecars
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"
      # Match the official Apple Silicon build's features using its native
      # library preparation path, without its signing or release steps.
      - name: Resolve mesh-llm revision
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::mesh-llm revision not found"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"
      - name: Restore mesh llama build cache
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}
      - name: Prepare mesh llama native libraries
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$MESH_REV_SHORT" -type d -name "$MESH_REV_SHORT" | head -1)
          [[ -n "$MESH_ROOT" ]] || { echo "::error::mesh-llm checkout not found"; exit 1; }
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Build local repair app
        run: cd desktop && pnpm tauri build --no-sign --features mesh-llm --target "$TARGET" --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
      - name: Archive the app with its source identity
        run: |
          set -euo pipefail
          git rev-parse HEAD > desktop/src-tauri/target/source-commit.txt
          ditto -c -k --sequesterRsrc --keepParent "desktop/src-tauri/target/$TARGET/release/bundle/macos/Buzz.app" desktop/src-tauri/target/Buzz-repair.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-desktop-repair-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            desktop/src-tauri/target/Buzz-repair.zip
            desktop/src-tauri/target/source-commit.txt
          if-no-files-found: error
          retention-days: 7
